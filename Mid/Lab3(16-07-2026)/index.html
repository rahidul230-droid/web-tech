<html>

<head>

    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

</head>

<body>

    <div class="container">

        <form onsubmit="return register();">

            <fieldset class="main">

                <legend>Student Registration</legend>

                <table class="form-table">

                    <tr>

                        <td>
                            <label>First Name <span class="required">*</span></label>
                        </td>

                        <td>
                            <input type="text" id="firstName">
                        </td>

                        <td>
                            <p id="firstNameError" class="error"></p>
                        </td>

                    </tr>

                    <tr>

                        <td>
                            <label>Last Name <span class="required">*</span></label>
                        </td>

                        <td>
                            <input type="text" id="lastName">
                        </td>

                        <td>
                            <p id="lastNameError" class="error"></p>
                        </td>

                    </tr>

                    <tr>

                        <td>
                            <label>Student ID <span class="required">*</span></label>
                        </td>

                        <td>
                            <input type="text" id="studentId">
                        </td>

                        <td>
                            <p id="studentIdError" class="error"></p>
                        </td>

                    </tr>

                    <tr>

                        <td>
                            <label>Email <span class="required">*</span></label>
                        </td>

                        <td>
                            <input type="text" id="email">
                        </td>

                        <td>
                            <p id="emailError" class="error"></p>
                        </td>

                    </tr>

                    <tr>

                        <td>
                            <label>Credit Completed <span class="required">*</span></label>
                        </td>

                        <td>
                            <input type="number" id="credit">
                        </td>

                        <td>
                            <p id="creditError" class="error"></p>
                        </td>

                    </tr>

                    <tr>

                        <td>
                            <label>Department <span class="required">*</span></label>
                        </td>

                        <td>

                            <select id="department">
                                <option value="">Select Department</option>
                                <option value="CSE">CSE</option>
                                <option value="EEE">EEE</option>
                                <option value="BBA">BBA</option>
                                <option value="Architecture">Architecture</option>

                            </select>

                        </td>

                        <td>
                            <p id="departmentError" class="error"></p>
                        </td>

                    </tr>

                </table>

                <div class="button-box">

                    <button type="submit">Submit</button>

                </div>

            </fieldset>

        </form>

        <div class="list-box">

            <h2>Registered Student List</h2>

            <table class="studentTable">
            

                <tr>

                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Student ID</th>
                    <th>Email</th>
                    <th>Credit</th>
                    <th>Department</th>

                </tr>
                

                <tbody id="studentList">

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
